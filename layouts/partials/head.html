<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071115">
<title>{{ .Title }}</title>
<meta name="description" content="{{ .Description }}">
<meta name="author" content="Diego Miralles">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="{{ .Permalink }}">
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">{{ end }}
{{ range .AllTranslations }}{{ if eq .Language.Lang "en" }}<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">{{ end }}{{ end }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Diego Miralles">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="{{ if eq .Site.Language.Lang "es" }}es_ES{{ else }}en_GB{{ end }}">
<meta property="og:image" content="{{ "og.png" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ if eq .Site.Language.Lang "es" }}Diego Miralles — Portfolio de Ingeniería Química{{ else }}Diego Miralles — Chemical Engineering Portfolio{{ end }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description }}">
<meta name="twitter:image" content="{{ "og.png" | absURL }}">
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
{{ with resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">{{ end }}
{{ with resources.Get "js/main.js" | minify | fingerprint }}<script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>{{ end }}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Diego Miralles","url":"{{ .Site.BaseURL }}","email":"mailto:diegomirallespomares@gmail.com","homeLocation":{"@type":"Place","name":"Elche, Alicante, Spain"},"affiliation":{"@type":"CollegeOrUniversity","name":"University of Alicante"},"sameAs":["https://github.com/Diego-Miralles"]}</script>
