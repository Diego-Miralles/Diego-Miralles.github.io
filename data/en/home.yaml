  dwsim_status: Personal academic study · 2026
  dwsim_title: Ethanol Recovery — Flash & Distillation
  dwsim_text: An ethanol-water separation simulation in DWSIM. I compared seven flash temperatures and documented their effect
    on recovery, purity and energy use.
  dwsim_note: I selected 88 °C for its lowest specific energy among the cases tested. Component balances remain within the
    0.5% tolerance. The model has not been experimentally validated.
  dwsim_tags:
  - DWSIM 9.0.5
  - NRTL
  - Excel
  dwsim_metrics:
  - value: 58.4%
    label: ethanol recovery at 88 °C
  - value: 62.0 wt%
    label: ethanol purity in vapour
  - value: '1.098'
    label: kWh/kg recovered EtOH
  dwsim_case_cta: View full case study
  dwsim_report_cta: Download report
  dwsim_gallery_label: Ethanol recovery project views
  dwsim_gallery_prev: Previous project view
  dwsim_gallery_next: Next project view
  dwsim_gallery:
  - src: /projects/ethanol-flash-dwsim.png
    alt: DWSIM flowsheet of the ethanol-water flash reference case
    caption: 'Reference flowsheet: feed, heater, two-phase stream and flash separator.'
    fit: contain
  - src: /projects/ethanol-tradeoff-en.svg
    alt: Ethanol recovery and vapour purity across flash temperatures
    caption: 'Simulation sweep: increasing temperature raises recovery and reduces vapour purity.'
    fit: contain
  - src: /projects/ethanol-column-schematic.svg
    alt: Simplified ethanol-water distillation column
    caption: A separate multistage scenario explores the purity gain and energy cost of higher reflux.
    fit: contain
  peer_note: The images are portfolio illustrations with synthetic data, not screenshots of analyses of real companies.
  dwsim_conditions: 'Simulation results at 88 °C and 1 bar. Feed: 100 kg/h, 30 wt% ethanol, entering at 25 °C.'
