title: "Ethanol recovery through flash separation and distillation"
intro: "A reproducible DWSIM study of how heater outlet temperature changes ethanol recovery, vapour purity and specific energy in an ethanol-water flash, followed by a separate exploratory multistage-distillation scenario."
scope_note: "Personal academic project. The flash and column use different feed bases and are therefore interpreted as complementary studies, not as a direct energy comparison."
