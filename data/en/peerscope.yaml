kicker: "PeerScope / Case study / 2026"
title: "From financial records to a chemical-sector competitive diagnosis."
intro: "PeerScope is a competitive-intelligence platform for chemical manufacturing companies. It turns financial data into comparable indicators, peer benchmarks, interpretable scores and decision-ready reports."
collaboration: "Co-created by Diego Miralles and Javier Gonzálvez. Every figure on this page describes the shared platform as a whole, rather than either person's individual output. Metrics are a September 2026 snapshot."
