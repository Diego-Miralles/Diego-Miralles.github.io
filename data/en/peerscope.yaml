hero_alt: "Synthetic PeerScope chemical-sector benchmark and competitive scoring interface"
hero_caption: "Benchmark and competitive scoring interface shown with fully synthetic demonstration data."
challenge_kicker: "01 / The challenge"
challenge_title: "Make company accounts comparable—and the result understandable."
challenge_text: "Raw financial records are useful, but they do not immediately explain how a company stands against relevant peers. PeerScope structures that information into a consistent analytical path designed around comparison, interpretation and traceability."
sector_title: "Why the chemical sector matters"
sector_text: "The platform narrows the comparison to chemical manufacturing, so the benchmark is framed around a relevant operating context instead of a generic cross-industry average."
flow_kicker: "02 / Product workflow"
flow_title: "A clear route from source data to an executive view."
flow:
  - { n: "01", title: "Structure", text: "Prepare financial records and normalize the indicators needed for comparison." }
  - { n: "02", title: "Benchmark", text: "Position a company against its peer group and chemical-sector reference set." }
  - { n: "03", title: "Interpret", text: "Translate relative performance into six readable scoring dimensions and diagnostics." }
  - { n: "04", title: "Communicate", text: "Present the result through dashboards and executive reporting designed for decisions." }
product_alt: "Synthetic PeerScope product interface"
product_caption: "The product interface explains the path from financial records to competitive diagnosis."
evidence_kicker: "03 / Technical evidence"
evidence_title: "The architecture makes the analytical boundary visible."
evidence_text: "The product separates the public experience, the analytical workflow and private imports. That separation makes the route from input to score easier to inspect and keeps the scoring path explicit."
architecture_alt: "PeerScope system architecture and analytical flow diagram"
architecture_caption: "Traceable analytical flow; private imports remain isolated from scoring."
stack_label: "Visible analytical building blocks"
stack: ["SABI base dataset", "Normalization & validation", "KPIs & rules", "Peer groups & percentiles", "Automated testing", "HTML/PDF reports"]
scope_kicker: "04 / Scope and authorship"
scope_title: "A shared product, presented without inflating individual claims."
scope_text: "PeerScope is included here because Diego participated in building the project. The platform-level results remain explicitly attributed to the collaboration, which is the most accurate way to show the work."
limitations_title: "Current scope"
limitations:
  - "The public screens use fully synthetic demonstration data."
  - "The product is presented as a functional private beta, not a finished commercial service."
  - "Its diagnostics support analysis; they do not replace specialist financial or strategic judgement."
