kicker: PeerScope / Case study / 2026
title: 'PeerScope: comparing chemical companies'
intro: A platform for comparing financial indicators of chemical manufacturing companies. It organises data, peer groups and
  results into dashboards and reports.
collaboration: Co-created by Diego Miralles and Javier Gonzálvez. Every figure on this page describes the shared platform
  as a whole, rather than either person's individual output. Metrics are a September 2026 snapshot.
metrics: []
hero_alt: Benchmark illustration using synthetic data.
hero_caption: Benchmark illustration using synthetic data.
challenge_kicker: 01 / The challenge
challenge_title: Make company accounts comparable—and the result understandable.
challenge_text: Raw financial records are useful, but they do not immediately explain how a company stands against relevant
  peers. PeerScope structures that information into a consistent analytical path designed around comparison, interpretation
  and traceability.
sector_title: Why the chemical sector matters
sector_text: The platform narrows the comparison to chemical manufacturing, so the benchmark is framed around a relevant operating
  context instead of a generic cross-industry average.
flow_kicker: 02 / Product workflow
flow_title: From financial records to a report
flow:
- n: '01'
  title: Structure
  text: Prepare financial records and normalize the indicators needed for comparison.
- n: '02'
  title: Benchmark
  text: Position a company against its peer group and chemical-sector reference set.
- n: '03'
  title: Interpret
  text: Translate relative performance into six readable scoring dimensions and diagnostics.
- n: '04'
  title: Communicate
  text: Present the result through dashboards and executive reporting designed for decisions.
product_alt: Interface illustration using synthetic data.
product_caption: Interface illustration using synthetic data.
evidence_kicker: 03 / Architecture
evidence_title: Separating analysis from private imports
evidence_text: The product separates the public experience, the analytical workflow and private imports. That separation makes
  the route from input to score easier to inspect and keeps the scoring path explicit.
architecture_alt: PeerScope system architecture and analytical flow diagram
architecture_caption: Traceable analytical flow; private imports remain isolated from scoring.
stack_label: Visible analytical building blocks
stack:
- SABI base dataset
- Normalization & validation
- KPIs & rules
- Peer groups & percentiles
- Automated testing
- HTML/PDF reports
scope_kicker: 04 / Scope and authorship
scope_title: A shared product, presented without inflating individual claims.
scope_text: PeerScope is included here because Diego participated in building the project. The platform-level results remain
  explicitly attributed to the collaboration, which is the most accurate way to show the work.
limitations_title: Current scope
limitations:
- The two interface views are illustrations made for the portfolio with synthetic data, not screenshots of the product in
  use.
- The product is presented as a functional private beta, not a finished commercial service.
- Its diagnostics support analysis; they do not replace specialist financial or strategic judgement.
- The platform source code, original data and tests are not published in this repository.
