title: "Recuperación de etanol mediante separación flash y destilación"
intro: "Estudio reproducible en DWSIM sobre cómo la temperatura de salida del calentador modifica la recuperación de etanol, la pureza del vapor y la energía específica en un flash agua-etanol, seguido de un escenario exploratorio independiente de destilación multietapa."
scope_note: "Proyecto académico personal. El flash y la columna utilizan alimentaciones diferentes y se interpretan como estudios complementarios, no como una comparación energética directa."
