  dwsim_status: Estudio académico personal · 2026
  dwsim_title: Recuperación de etanol — Flash y destilación
  dwsim_text: Simulación de una separación agua-etanol en DWSIM. Comparé siete temperaturas de flash y documenté el efecto
    sobre la recuperación, la pureza y el consumo energético.
  dwsim_note: Elegí 88 °C por su menor energía específica entre los casos ensayados. Los balances de componentes quedan dentro
    de la tolerancia del 0,5%. El modelo no tiene validación experimental.
  dwsim_tags:
  - DWSIM 9.0.5
  - NRTL
  - Excel
  dwsim_metrics:
  - value: 58,4%
    label: recuperación de etanol a 88 °C
  - value: 62,0% masa
    label: pureza de etanol en el vapor
  - value: 1,098
    label: kWh/kg de EtOH recuperado
  dwsim_case_cta: Ver caso de estudio completo
  dwsim_report_cta: Descargar informe
  dwsim_gallery_label: Vistas del proyecto de recuperación de etanol
  dwsim_gallery_prev: Vista anterior del proyecto
  dwsim_gallery_next: Vista siguiente del proyecto
  dwsim_gallery:
  - src: /projects/ethanol-flash-dwsim.png
    alt: Flowsheet de DWSIM del caso de referencia flash agua-etanol
    caption: 'Flowsheet de referencia: alimentación, calentador, corriente bifásica y separador flash.'
    fit: contain
  - src: /projects/ethanol-tradeoff-es.svg
    alt: Recuperación de etanol y pureza del vapor a distintas temperaturas de flash
    caption: 'Barrido de simulación: al subir la temperatura aumenta la recuperación y disminuye la pureza del vapor.'
    fit: contain
  - src: /projects/ethanol-column-schematic-es.svg
    alt: Esquema simplificado de una columna de destilación agua-etanol
    caption: Un escenario multietapa independiente explora la ganancia de pureza y el coste energético de aumentar el reflujo.
    fit: contain
  peer_note: Las imágenes son ilustraciones del portfolio con datos sintéticos; no son capturas de análisis de empresas reales.
