title: "De los datos financieros a un diagnóstico competitivo del sector químico."
intro: "PeerScope es una plataforma de inteligencia competitiva para empresas de fabricación química. Convierte datos financieros en indicadores comparables, benchmarks, puntuaciones interpretables e informes orientados a la toma de decisiones."
collaboration: "Cocreado por Diego Miralles y Javier Gonzálvez. Todas las cifras de esta página describen el conjunto de la plataforma compartida, no el trabajo individual de ninguno de los dos. Las métricas corresponden a septiembre de 2026."
