    <text x="24" y="38" class="m sm" font-weight="700">SEIS DIMENSIONES INTERPRETABLES</text>
    <g class="s"><text x="24" y="82" class="b">Rentabilidad</text><rect x="160" y="69" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="69" width="211" height="12" rx="6" fill="url(#bar)"/><text x="418" y="81" text-anchor="end" class="m sm">84</text>
    <text x="24" y="126" class="b">Solidez</text><rect x="160" y="113" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="113" width="193" height="12" rx="6" fill="url(#bar)"/><text x="418" y="125" text-anchor="end" class="m sm">77</text>
    <text x="24" y="170" class="b">Productividad</text><rect x="160" y="157" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="157" width="178" height="12" rx="6" fill="url(#bar)"/><text x="418" y="169" text-anchor="end" class="m sm">71</text>
    <text x="24" y="214" class="b">Operaciones</text><rect x="160" y="201" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="201" width="160" height="12" rx="6" fill="url(#bar)"/><text x="418" y="213" text-anchor="end" class="m sm">64</text>
    <text x="24" y="258" class="b">Liquidez</text><rect x="160" y="245" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="245" width="185" height="12" rx="6" fill="url(#bar)"/><text x="418" y="257" text-anchor="end" class="m sm">74</text>
    <text x="24" y="302" class="b">Crecimiento</text><rect x="160" y="289" width="250" height="12" rx="6" fill="#e4ecee"/><rect x="160" y="289" width="145" height="12" rx="6" fill="url(#bar)"/><text x="418" y="301" text-anchor="end" class="m sm">58</text></g>
  </g>
  <g transform="translate(877 345)">
    <rect width="271" height="341" rx="19" class="box" filter="url(#shadow)"/>
    <text x="22" y="38" class="m sm" font-weight="700">DIAGNÓSTICO</text>
    <rect x="22" y="59" width="227" height="84" rx="13" fill="#eff9f6"/><circle cx="42" cy="83" r="5" fill="#32a893"/><text x="56" y="87" class="b s">Fortaleza</text><text x="42" y="112" class="m sm">Rentabilidad por encima</text><text x="42" y="130" class="m sm">del grupo comparable</text>
    <rect x="22" y="157" width="227" height="84" rx="13" fill="#fff8ed"/><circle cx="42" cy="181" r="5" fill="#d98934"/><text x="56" y="185" class="b s">Palanca</text><text x="42" y="210" class="m sm">Revisar eficiencia</text><text x="42" y="228" class="m sm">operativa y crecimiento</text>
    <rect x="22" y="263" width="227" height="45" rx="11" fill="#167b70"/><text x="135" y="291" text-anchor="middle" class="w s">Generar informe</text>
    <text x="135" y="329" text-anchor="middle" class="m sm">Vista sintética · Sept. 2026</text>
  </g>
</svg>

