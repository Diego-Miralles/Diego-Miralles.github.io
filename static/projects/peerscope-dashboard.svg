    <text x="26" y="71" class="b" font-size="20">26–50 empleados</text><text x="26" y="96" class="m s">Ingresos altos · Fabricación química</text>
    <line x1="26" y1="124" x2="307" y2="124" stroke="#e4ecee"/>
    <text x="26" y="156" class="m sm" font-weight="700">POSICIÓN GLOBAL</text><text x="26" y="203" class="teal" font-family="Arial,sans-serif" font-size="42" font-weight="700">78</text><text x="80" y="203" class="m s">/ 100</text>
    <rect x="26" y="226" width="281" height="10" rx="5" fill="#e3ecee"/><rect x="26" y="226" width="219" height="10" rx="5" fill="url(#bar)"/>
    <rect x="26" y="265" width="121" height="31" rx="16" class="chip"/><text x="86" y="285" text-anchor="middle" class="teal sm" font-weight="700">Tier: Sólido</text>
