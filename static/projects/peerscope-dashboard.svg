<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PeerScope synthetic chemical-sector benchmark</title>
  <desc id="desc">Synthetic product view with a fictional company, peer benchmark, six scores and competitive diagnostics.</desc>
  <defs>
    <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0b302c"/><stop offset="1" stop-color="#0e4740"/></linearGradient>
    <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#167b70"/><stop offset="1" stop-color="#39b5a4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173238" flood-opacity=".12"/></filter>
    <style>.t{font-family:Arial,sans-serif;fill:#17252a}.m{font-family:Arial,sans-serif;fill:#66757b}.b{font-family:Arial,sans-serif;font-weight:700;fill:#17252a}.w{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.s{font-size:14px}.sm{font-size:12px}.h{font-size:27px}.box{fill:#fff;stroke:#dce8e8}.chip{fill:#e7f7f3}.teal{fill:#167b70}</style>
  </defs>
  <rect width="1200" height="760" fill="#f5f8fa"/>
  <rect width="1200" height="72" fill="#fff"/>
  <rect x="52" y="18" width="38" height="38" rx="11" fill="#0c3934"/><text x="71" y="43" text-anchor="middle" class="w s">PS</text>
  <text x="104" y="42" class="b" font-size="18">PeerScope</text><text x="206" y="42" class="teal s">Beta</text>
  <text x="475" y="42" class="b s">Producto</text><text x="560" y="42" class="m s">Empresas</text><text x="649" y="42" class="m s">Informes</text><text x="727" y="42" class="m s">Metodología</text>
  <rect x="972" y="17" width="176" height="38" rx="10" fill="#e7f7f3"/><text x="1060" y="41" text-anchor="middle" class="teal s" font-weight="700">DATOS SINTÉTICOS</text>
  <rect x="52" y="104" width="1096" height="134" rx="20" fill="url(#head)" filter="url(#shadow)"/>
  <rect x="78" y="128" width="149" height="28" rx="14" fill="#daf4ed"/><text x="153" y="147" text-anchor="middle" class="teal sm" font-weight="700">EJEMPLO DE DEMO</text>
  <text x="78" y="190" class="w h">EMPRESA SINTÉTICA 001</text>
  <text x="78" y="216" fill="#cfe5e1" class="s" font-family="Arial,sans-serif">Fabricación química · Grupo comparable: 26–50 empleados</text>
  <text x="1106" y="151" text-anchor="end" fill="#bfe6df" class="sm" font-family="Arial,sans-serif">NO REPRESENTA UNA EMPRESA REAL</text>
  <g transform="translate(52 267)">
    <rect width="1096" height="52" rx="13" fill="#fff" stroke="#dce8e8"/>
    <rect x="10" y="8" width="261" height="36" rx="9" fill="#eef3f4"/><text x="141" y="31" text-anchor="middle" class="m s">Diagnóstico</text>
    <rect x="279" y="8" width="261" height="36" rx="9" fill="#167b70"/><text x="410" y="31" text-anchor="middle" class="w s">Benchmark</text>
    <rect x="548" y="8" width="261" height="36" rx="9" fill="#eef3f4"/><text x="679" y="31" text-anchor="middle" class="m s">AI Analyst</text>
    <rect x="817" y="8" width="269" height="36" rx="9" fill="#eef3f4"/><text x="951" y="31" text-anchor="middle" class="m s">Informe ejecutivo</text>
  </g>
  <g transform="translate(52 345)">
