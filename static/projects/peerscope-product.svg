<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PeerScope synthetic product overview</title>
  <desc id="desc">Synthetic product landing view explaining the flow from financial data to an actionable competitive diagnosis.</desc>
  <defs><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#167b70"/><stop offset="1" stop-color="#42b7a7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#19363b" flood-opacity=".14"/></filter><style>.t{font-family:Arial,sans-serif;fill:#1d2428}.m{font-family:Arial,sans-serif;fill:#68757b}.b{font-family:Arial,sans-serif;font-weight:700;fill:#1d2428}.w{font-family:Arial,sans-serif;font-weight:700;fill:#fff}.teal{fill:#157e71}.s{font-size:14px}.sm{font-size:12px}</style></defs>
  <rect width="1200" height="760" fill="#f8fafb"/>
  <rect width="1200" height="74" fill="#fff" stroke="#e5ecee"/>
  <rect x="52" y="18" width="38" height="38" rx="11" fill="#0c3934"/><text x="71" y="43" text-anchor="middle" class="w s">PS</text><text x="104" y="42" class="b" font-size="18">PeerScope</text><text x="205" y="42" class="teal s">Beta</text>
  <text x="420" y="42" class="b s">Producto</text><text x="505" y="42" class="m s">Cómo funciona</text><text x="616" y="42" class="m s">Informes</text><text x="691" y="42" class="m s">Seguridad</text>
  <rect x="948" y="17" width="92" height="40" rx="10" fill="#fff" stroke="#dce5e7"/><text x="994" y="42" text-anchor="middle" class="b s">Ver demo</text><rect x="1052" y="17" width="96" height="40" rx="10" fill="#0c3934"/><text x="1100" y="42" text-anchor="middle" class="w s">Acceder</text>
  <rect x="52" y="132" width="290" height="31" rx="16" fill="#e6f7f3"/><text x="197" y="152" text-anchor="middle" class="teal sm" font-weight="700">DEMO CON DATOS TOTALMENTE SINTÉTICOS</text>
  <text x="52" y="232" class="t" font-family="Arial,sans-serif" font-size="63" font-weight="700">Convierte datos</text><text x="52" y="300" class="t" font-family="Arial,sans-serif" font-size="63" font-weight="700">financieros en</text><text x="52" y="368" class="t" font-family="Arial,sans-serif" font-size="63" font-weight="700">diagnóstico competitivo.</text>
  <text x="52" y="417" class="m" font-family="Arial,sans-serif" font-size="20">Compara empresas de fabricación química con grupos</text><text x="52" y="448" class="m" font-family="Arial,sans-serif" font-size="20">similares y convierte la evidencia en decisiones trazables.</text>
  <rect x="52" y="488" width="153" height="47" rx="11" fill="#167b70"/><text x="129" y="518" text-anchor="middle" class="w s">Explorar demo</text><rect x="217" y="488" width="168" height="47" rx="11" fill="#fff" stroke="#d8e2e4"/><text x="301" y="518" text-anchor="middle" class="b s">Cómo funciona</text>
  <g transform="translate(704 130)" filter="url(#shadow)">
    <rect width="444" height="507" rx="24" fill="#fff" stroke="#dce7e8"/>
    <circle cx="26" cy="25" r="5" fill="#d9e3e5"/><circle cx="43" cy="25" r="5" fill="#d9e3e5"/><circle cx="60" cy="25" r="5" fill="#d9e3e5"/><line x1="0" y1="51" x2="444" y2="51" stroke="#e4ecee"/>
    <text x="28" y="92" class="m sm" font-weight="700">EMPRESA ANALIZADA</text><text x="28" y="122" class="b" font-size="19">EMPRESA SINTÉTICA 001</text><text x="28" y="148" class="m s">Peer group: 26–50 empleados · ingresos altos</text><rect x="28" y="162" width="98" height="27" rx="14" fill="#e7f7f3"/><text x="77" y="180" text-anchor="middle" class="teal sm" font-weight="700">Tier: Sólido</text>
    <line x1="0" y1="214" x2="444" y2="214" stroke="#e4ecee"/>
    <g><text x="28" y="258" class="b sm">Rentabilidad</text><rect x="150" y="246" width="260" height="10" rx="5" fill="#e4ecee"/><rect x="150" y="246" width="225" height="10" rx="5" fill="url(#bar)"/>
    <text x="28" y="296" class="b sm">Solidez</text><rect x="150" y="284" width="260" height="10" rx="5" fill="#e4ecee"/><rect x="150" y="284" width="205" height="10" rx="5" fill="url(#bar)"/>
    <text x="28" y="334" class="b sm">Productividad</text><rect x="150" y="322" width="260" height="10" rx="5" fill="#e4ecee"/><rect x="150" y="322" width="183" height="10" rx="5" fill="url(#bar)"/>
    <text x="28" y="372" class="b sm">Operaciones</text><rect x="150" y="360" width="260" height="10" rx="5" fill="#e4ecee"/><rect x="150" y="360" width="165" height="10" rx="5" fill="url(#bar)"/></g>
    <rect x="28" y="405" width="388" height="74" rx="13" fill="#f0f7f6"/><text x="46" y="431" class="teal sm" font-weight="700">DIAGNÓSTICO INTERPRETABLE</text><text x="46" y="455" class="m sm">Fortaleza: rentabilidad · Palanca: operaciones</text><text x="46" y="472" class="m sm">Vista sintética; no representa una empresa real.</text>
  </g>
  <g transform="translate(52 610)"><text class="m sm" font-weight="700">FLUJO ANALÍTICO</text><rect x="0" y="30" width="128" height="54" rx="12" fill="#fff" stroke="#dce7e8"/><text x="64" y="63" text-anchor="middle" class="b s">01 · Estructurar</text><path d="M128 57h30" stroke="#39a696" stroke-width="2"/><path d="m158 57-8-5v10z" fill="#39a696"/><rect x="166" y="30" width="128" height="54" rx="12" fill="#fff" stroke="#dce7e8"/><text x="230" y="63" text-anchor="middle" class="b s">02 · Comparar</text><path d="M294 57h30" stroke="#39a696" stroke-width="2"/><path d="m324 57-8-5v10z" fill="#39a696"/><rect x="332" y="30" width="128" height="54" rx="12" fill="#fff" stroke="#dce7e8"/><text x="396" y="63" text-anchor="middle" class="b s">03 · Interpretar</text><path d="M460 57h30" stroke="#39a696" stroke-width="2"/><path d="m490 57-8-5v10z" fill="#39a696"/><rect x="498" y="30" width="128" height="54" rx="12" fill="#0c3934"/><text x="562" y="63" text-anchor="middle" class="w s">04 · Comunicar</text></g>
</svg>
