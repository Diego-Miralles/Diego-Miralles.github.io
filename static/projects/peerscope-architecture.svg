<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PeerScope analytical architecture</title>
  <desc id="desc">The base SABI dataset flows through normalization, KPIs, peer groups, scoring, diagnostics, AI analysis and reports. Private CSV and XLSX imports follow an isolated account-scoped route and do not enter scoring automatically.</desc>
  <defs><style>.bg{fill:#f7fbfc}.box{fill:#fff;stroke:#176b87;stroke-width:2}.private{fill:#fff8ec;stroke:#b66b15;stroke-width:2}.t{font:600 20px Arial,sans-serif;fill:#12323d}.s{font:15px Arial,sans-serif;fill:#48636d}.arrow{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#m)}.dash{stroke:#b66b15;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#mo)}.label{font:700 15px Arial,sans-serif;fill:#8b4c08}.tag{fill:#176b87}.tagt{font:700 14px Arial,sans-serif;fill:#fff}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b87"/></marker><marker id="mo" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b66b15"/></marker></defs>
  <rect class="bg" width="1200" height="760" rx="28"/><text x="70" y="60" class="t" style="font-size:30px">PeerScope · traceable analysis before AI</text><rect x="965" y="32" width="165" height="34" rx="17" class="tag"/><text x="1047" y="55" text-anchor="middle" class="tagt">FUNCTIONAL BETA</text>
  <rect class="box" x="55" y="125" width="180" height="90" rx="14"/><text class="t" x="145" y="160" text-anchor="middle">Base dataset</text><text class="s" x="145" y="188" text-anchor="middle">SABI · 1,777 companies</text>
  <rect class="box" x="275" y="125" width="180" height="90" rx="14"/><text class="t" x="365" y="160" text-anchor="middle">Normalize</text><text class="s" x="365" y="188" text-anchor="middle">validate · canonicalize</text>
  <rect class="box" x="495" y="125" width="180" height="90" rx="14"/><text class="t" x="585" y="160" text-anchor="middle">KPIs + rules</text><text class="s" x="585" y="188" text-anchor="middle">chemical Sector Pack</text>
  <rect class="box" x="715" y="125" width="180" height="90" rx="14"/><text class="t" x="805" y="160" text-anchor="middle">Peer groups</text><text class="s" x="805" y="188" text-anchor="middle">scale · revenue · context</text>
  <rect class="box" x="935" y="125" width="210" height="90" rx="14"/><text class="t" x="1040" y="160" text-anchor="middle">Percentiles + score</text><text class="s" x="1040" y="188" text-anchor="middle">6 interpretable dimensions</text>
  <path class="arrow" d="M235 170H270"/><path class="arrow" d="M455 170H490"/><path class="arrow" d="M675 170H710"/><path class="arrow" d="M895 170H930"/>
  <rect class="box" x="805" y="305" width="250" height="95" rx="14"/><text class="t" x="930" y="342" text-anchor="middle">Diagnostics + levers</text><text class="s" x="930" y="370" text-anchor="middle">strengths · alerts · gaps</text><path class="arrow" d="M1040 215V260Q1040 280 1020 280H950Q930 280 930 300"/>
  <rect class="box" x="505" y="305" width="230" height="95" rx="14"/><text class="t" x="620" y="342" text-anchor="middle">AI Analyst</text><text class="s" x="620" y="370" text-anchor="middle">grounded explanation</text><path class="arrow" d="M805 352H740"/>
  <rect class="box" x="190" y="305" width="245" height="95" rx="14"/><text class="t" x="312" y="342" text-anchor="middle">Versioned reports</text><text class="s" x="312" y="370" text-anchor="middle">preview · HTML / PDF</text><path class="arrow" d="M505 352H440"/>
  <rect class="private" x="55" y="515" width="235" height="105" rx="14"/><text class="t" x="172" y="552" text-anchor="middle">Private CSV / XLSX</text><text class="s" x="172" y="580" text-anchor="middle">account / organization scoped</text>
  <rect class="private" x="385" y="515" width="245" height="105" rx="14"/><text class="t" x="507" y="552" text-anchor="middle">Isolated import store</text><text class="s" x="507" y="580" text-anchor="middle">history · normalized export</text><path class="dash" d="M290 567H380"/>
  <rect class="private" x="725" y="515" width="420" height="105" rx="14"/><text class="t" x="935" y="550" text-anchor="middle">Explicit integration boundary</text><text class="label" x="935" y="581" text-anchor="middle">DOES NOT FEED SCORING AUTOMATICALLY</text><path class="dash" d="M630 567H720"/>
  <path d="M935 510V450Q935 430 955 430H1035Q1055 430 1055 405" stroke="#b66b15" stroke-width="2" stroke-dasharray="7 8" fill="none"/><text class="s" x="70" y="700">Deterministic methodology produces the score; AI is a later, grounded interaction and writing layer.</text>
</svg>
