<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Esquema de la columna de destilación agua-etanol en DWSIM</title>
  <desc id="desc">Columna de destilación multietapa con relación de reflujo 2, condensador y rehervidor. El caso base registrado alcanza un 91,38 por ciento en masa de etanol en el destilado.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1c21"/><stop offset="1" stop-color="#071115"/></linearGradient><linearGradient id="col" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12343a"/><stop offset="1" stop-color="#0a1b20"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g stroke="#d7f4ef" stroke-opacity=".07"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/><path d="M80 0V760M160 0V760M240 0V760M320 0V760M400 0V760M480 0V760M560 0V760M640 0V760M720 0V760M800 0V760M880 0V760M960 0V760M1040 0V760M1120 0V760"/></g>
  <text x="72" y="66" fill="#62d4c6" font-family="Consolas,monospace" font-size="16" letter-spacing="3">DWSIM / NRTL / EXTENSIÓN CON DESTILACIÓN</text>
  <text x="72" y="110" fill="#eef8f6" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="600">La separación multietapa aumenta la pureza del producto.</text>
  <g stroke="#62d4c6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 410H430"/><path d="M420 402l14 8-14 8" fill="#62d4c6"/>
    <path d="M574 188V142H805V210"/><path d="M796 199l9 14 9-14" fill="#62d4c6"/>
    <path d="M574 574V630H824"/><path d="M812 622l14 8-14 8" fill="#62d4c6"/>
  </g>
  <g stroke="#f0a864" stroke-width="4" fill="none" stroke-linecap="round"><path d="M705 248H895V170H1015"/><path d="M1003 162l14 8-14 8" fill="#f0a864"/><path d="M705 520H895V592H1015"/><path d="M1003 584l14 8-14 8" fill="#f0a864"/></g>
  <rect x="430" y="166" width="275" height="430" rx="78" fill="url(#col)" stroke="#62d4c6" stroke-width="4" filter="url(#glow)"/>
  <g stroke="#62d4c6" stroke-opacity=".45" stroke-width="2"><path d="M457 215H678M457 245H678M457 275H678M457 305H678M457 335H678M457 365H678M457 395H678M457 425H678M457 455H678M457 485H678M457 515H678M457 545H678"/></g>
  <circle cx="567" cy="410" r="10" fill="#f0a864"/><text x="567" y="390" text-anchor="middle" fill="#f0a864" font-family="Consolas,monospace" font-size="13">ENTRADA</text>
  <text x="567" y="324" text-anchor="middle" fill="#eef8f6" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">DC-1</text><text x="567" y="354" text-anchor="middle" fill="#91a9ad" font-family="Consolas,monospace" font-size="14">MULTIETAPA · RR = 2</text>
  <g font-family="Consolas,monospace"><text x="98" y="376" fill="#62d4c6" font-size="14">ALIMENTACIÓN</text><text x="98" y="398" fill="#b5c8c9" font-size="16">100 mol/s · 50% mol EtOH · 350 K</text><text x="844" y="133" fill="#f0a864" font-size="14">DESTILADO</text><text x="844" y="157" fill="#eef8f6" font-size="19">91,38% masa EtOH</text><text x="844" y="187" fill="#91a9ad" font-size="15">40,28% recuperación</text><text x="846" y="625" fill="#f0a864" font-size="14">FONDOS</text></g>
  <g transform="translate(822 286)"><rect width="306" height="198" rx="22" fill="#0d2429" stroke="#d7f4ef" stroke-opacity=".14"/><text x="24" y="38" fill="#62d4c6" font-family="Consolas,monospace" font-size="13" letter-spacing="2">CASO BASE / C-01</text><text x="24" y="80" fill="#eef8f6" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">xEtOH = 0,8057</text><text x="24" y="110" fill="#91a9ad" font-family="Segoe UI,Arial,sans-serif" font-size="15">fracción molar en destilado</text><path d="M24 132H282" stroke="#d7f4ef" stroke-opacity=".12"/><text x="24" y="164" fill="#f0a864" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Q<tspan baseline-shift="sub" font-size="13">reb</tspan> = 2.986,14 kW</text></g>
  <g transform="translate(728 196)"><rect width="92" height="72" rx="20" fill="#0a171c" stroke="#f0a864" stroke-width="3"/><path d="M16 36h60M25 20l42 32M67 20L25 52" stroke="#f0a864" stroke-width="2"/><text x="46" y="94" text-anchor="middle" fill="#91a9ad" font-family="Consolas,monospace" font-size="12">CONDENSADOR</text></g>
  <g transform="translate(728 484)"><rect width="92" height="72" rx="20" fill="#0a171c" stroke="#f0a864" stroke-width="3"/><path d="M16 36h60M25 20l42 32M67 20L25 52" stroke="#f0a864" stroke-width="2"/><text x="46" y="94" text-anchor="middle" fill="#91a9ad" font-family="Consolas,monospace" font-size="12">REHERVIDOR</text></g>
</svg>
